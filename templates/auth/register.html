{% extends "auth/_auth_base.html" %}
{% block title %}Create account{% endblock %}
{% block content %}
<h2>Create your account</h2>
<p class="muted" style="margin-bottom:22px">New accounts start as <b>staff</b>. An admin can give you manager access.</p>
<form method="post">
  <div class="field"><label for="name">Full name</label><input id="name" type="text" name="name" required value="{{ form.get('name','') }}"></div>
  <div class="field"><label for="email">Work email</label><input id="email" type="email" name="email" required value="{{ form.get('email','') }}"></div>
  <div class="row">
    <div class="field"><label for="password">Password</label><input id="password" type="password" name="password" minlength="6" required></div>
    <div class="field"><label for="confirm">Confirm</label><input id="confirm" type="password" name="confirm" minlength="6" required></div>
  </div>
  <button class="btn primary block" type="submit">Create account</button>
</form>
<p style="margin-top:16px;font-size:14px" class="muted">Already have one? <a href="{{ url_for('auth.login') }}">Log in</a></p>
{% endblock %}
